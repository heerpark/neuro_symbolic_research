# Same as anesi_n1.yaml (see that file for provenance notes) with N=2.
use_cuda: true
DEBUG: false
N: 2
op: add
y_encoding: base10
w_encoding: base10
model: full
test: true
batch_size: 16
batch_size_test: 16
amount_samples: 600
predict_only: true
use_prior: true
q_lr: 0.001
q_loss: mse
policy: 'off'
perception_lr: 0.001
perception_loss: log-q
percept_loss_pref: 1
epochs: 100
log_per_epoch: 10
layers: 3
hidden_size: 800
prune: false
dirichlet_init: 0.1
dirichlet_lr: 0.01
dirichlet_iters: 50
dirichlet_L2: 900000
K_beliefs: 2500
