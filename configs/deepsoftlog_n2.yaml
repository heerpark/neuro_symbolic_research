# Hand-authored (no N=2 config ships in the official repo): copy of config.yaml
# with digits: 2 and name updated. nb_epochs=100 for the same reason as n1.
project: mnist_addition
name: "2 digit"
program: "deepsoftlog/experiments/mnist_addition/programs/addition_embeddings.pl"
semantics: sdd2

nb_workers: 1
device: cpu
seed: 1337
verbose: true
digits: 2
data_subset: null
add_symb: true
max_proofs: null

optimizer: AdamW
functor_learning_rate: 0.0003
embedding_learning_rate: 0
batch_size: 4
nb_epochs: 100
weight_decay: 1.0e-05
grad_clip: null

embedding_dimensions: 10
embedding_initialization: sphere
embedding_metric: angle
