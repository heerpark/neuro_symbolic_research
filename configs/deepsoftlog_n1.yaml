# Copied from third_party/deepsoftlog/deepsoftlog/experiments/mnist_addition/config.yaml
# (pinned commit 87765eda25dc12b5faf6dbda71aa9fea3a0b2ac0), with nb_epochs overridden
# 3 -> 100 per paper Appendix D.1 (the repo's shipped default of 3 does not match the
# hyperparameters used to obtain the paper's reported 98.4+/-0.1 / 96.6+/-0.3 numbers).
# seed is overridden per-run by scripts/run_deepsoftlog.py.
project: mnist_addition
name: "1 digit"
program: "deepsoftlog/experiments/mnist_addition/programs/addition_embeddings.pl"
semantics: sdd2

nb_workers: 1
device: cpu
seed: 1337
verbose: true
digits: 1
data_subset: null
add_symb: true
max_proofs: null

optimizer: AdamW
functor_learning_rate: 0.0003
embedding_learning_rate: 0
batch_size: 4
nb_epochs: 100
weight_decay: 1.0e-05
grad_clip: null

embedding_dimensions: 10
embedding_initialization: sphere
embedding_metric: angle
